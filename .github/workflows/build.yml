name: Test and build image
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts && npm run vendor
      - run: node --check web/player.js
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: go build -o gateway . && node test/browser.cjs
  image:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: piped-sharing-gateway:${{ github.sha }}
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Restricted container smoke test
        run: |
          mkdir smoke-data
          chmod 777 smoke-data
          docker run -d --name gateway-smoke --memory=96m --memory-swap=96m --cpus=0.5 --pids-limit=32 --read-only --cap-drop=ALL --security-opt=no-new-privileges --network=none -v "$PWD/smoke-data:/data" -e PUBLIC_ORIGIN=https://share.example.com -e ADMIN_ORIGIN=https://piped.example.com -e BACKEND_ORIGIN=http://backend:8080 -e MEDIA_ORIGIN=https://media.example.com -e MEDIA_UPSTREAM=http://proxy:80 -e ADMIN_SECRET=example-smoke-secret-at-least-32-characters piped-sharing-gateway:${GITHUB_SHA}
          for i in $(seq 1 20); do docker exec gateway-smoke /gateway healthcheck && break; sleep 1; done
          docker exec gateway-smoke /gateway healthcheck
          test "$(docker inspect --format '{{.State.OOMKilled}}' gateway-smoke)" = false
          docker rm -f gateway-smoke
      - name: Export image
        run: |
          docker save piped-sharing-gateway:${GITHUB_SHA} | gzip -1 > image.tar.gz
          sha256sum image.tar.gz > image.tar.gz.sha256
          docker inspect --format '{{.Id}}' piped-sharing-gateway:${GITHUB_SHA} > image-id.txt
          printf '%s\n' "$GITHUB_SHA" > revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: gateway-image
          path: |
            image.tar.gz
            image.tar.gz.sha256
            image-id.txt
            revision.txt
      - name: Publish image bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "image-${GITHUB_SHA}" image.tar.gz image.tar.gz.sha256 image-id.txt revision.txt --title "Image ${GITHUB_SHA:0:12}" --notes "Linux amd64 image built from the tagged source revision. Runtime configuration is supplied by the operator."
